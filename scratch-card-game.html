<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0710">
<title>SECRET SCRATCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital@1&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#0c0710;color:#fff;
    font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:36px;-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .lock{font-size:46px;margin-bottom:20px;filter:grayscale(.1);opacity:.92}
  .kicker{font-family:"Bodoni Moda",serif;font-style:italic;letter-spacing:4px;
    color:#f29bc2;font-size:14px;margin-bottom:14px}
  .msg{font-size:18px;line-height:1.85;color:rgba(255,255,255,.9);max-width:280px}
  .sub{margin-top:16px;font-size:13px;line-height:1.7;color:rgba(255,255,255,.5);max-width:280px}
  .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#f29bc2;
    margin:22px 4px 0;opacity:.35;animation:b 1.4s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.9;transform:translateY(-3px)}}
</style>
</head>
<body>
  <div class="lock">🔒</div>
  <div class="kicker">SECRET SCRATCH</div>
  <div class="msg">集卡刮刮樂<br>正在整理中,即將推出 ♡</div>
  <div class="sub">敬請期待,更多他們的祕密即將解鎖</div>
  <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</body>
</html>
